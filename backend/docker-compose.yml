services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://communium:communium_dev_password@db:5432/communium
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: communium
      POSTGRES_USER: communium
      POSTGRES_PASSWORD: communium_dev_password
    ports:
      - "5433:5432"
    volumes:
      - communium-postgres-data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro

volumes:
  communium-postgres-data:
