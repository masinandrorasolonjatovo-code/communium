<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #64748b; }
      .box-title { font: 800 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 14px Arial, sans-serif; fill: #334155; }
      .box-small { font: 700 12px Arial, sans-serif; fill: #2563eb; }
      .white-title { font: 800 18px Arial, sans-serif; fill: #ffffff; }
      .white-text { font: 500 14px Arial, sans-serif; fill: #dbeafe; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 8 8; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .box-blue { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
      .box-soft { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; rx: 10; }
      .box-data { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .badge { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; rx: 16; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#f8fafc"/>

  <text x="70" y="70" class="title">Schema global - Module 4 Messagerie et communication temps reel</text>
  <text x="70" y="104" class="subtitle">Demarche complete de la solution The Communium : interface, API, temps reel, donnees et medias.</text>

  <rect x="70" y="150" width="250" height="115" class="box-soft"/>
  <text x="95" y="188" class="box-title">1. Utilisateur</text>
  <text x="95" y="216" class="box-text">PC, tablette ou mobile</text>
  <text x="95" y="241" class="box-text">Consulte, ecrit, appelle,</text>
  <text x="95" y="262" class="box-text">joint fichiers et images.</text>

  <rect x="405" y="135" width="305" height="145" class="box-blue"/>
  <text x="435" y="174" class="white-title">2. Frontend Next.js</text>
  <text x="435" y="205" class="white-text">Module 4 visible par l utilisateur</text>
  <text x="435" y="230" class="white-text">Liste discussions, groupes, appels</text>
  <text x="435" y="255" class="white-text">Conversation active et composer</text>

  <rect x="790" y="135" width="255" height="145" class="box-soft"/>
  <text x="820" y="174" class="box-title">3. APIs navigateur</text>
  <text x="820" y="205" class="box-text">Explorateur fichiers</text>
  <text x="820" y="230" class="box-text">Camera, micro, audio</text>
  <text x="820" y="255" class="box-text">Notifications systeme</text>

  <rect x="405" y="385" width="280" height="150" class="box-blue"/>
  <text x="435" y="424" class="white-title">4. API REST Express</text>
  <text x="435" y="455" class="white-text">Conversations et participants</text>
  <text x="435" y="480" class="white-text">Messages et pieces jointes</text>
  <text x="435" y="505" class="white-text">Call logs et statuts</text>

  <rect x="765" y="385" width="280" height="150" class="box-blue"/>
  <text x="795" y="424" class="white-title">5. Socket.IO</text>
  <text x="795" y="455" class="white-text">Salons user:{id}</text>
  <text x="795" y="480" class="white-text">Salons conversation:{id}</text>
  <text x="795" y="505" class="white-text">Diffusion temps reel</text>

  <rect x="405" y="650" width="280" height="135" class="box-data"/>
  <text x="435" y="690" class="box-title">6. PostgreSQL</text>
  <text x="435" y="720" class="box-text">Schema module4</text>
  <text x="435" y="745" class="box-text">conversations, participants,</text>
  <text x="435" y="770" class="box-text">messages, call_logs</text>

  <rect x="765" y="650" width="280" height="135" class="box-data"/>
  <text x="795" y="690" class="box-title">7. Stockage medias</text>
  <text x="795" y="720" class="box-text">Production future</text>
  <text x="795" y="745" class="box-text">S3, Supabase Storage</text>
  <text x="795" y="770" class="box-text">ou Azure Blob Storage</text>

  <rect x="1110" y="385" width="235" height="150" class="box-soft"/>
  <text x="1140" y="424" class="box-title">8. Notifications</text>
  <text x="1140" y="455" class="box-text">In-app</text>
  <text x="1140" y="480" class="box-text">Navigateur</text>
  <text x="1140" y="505" class="box-text">Email / SMS a venir</text>

  <path d="M320 207 C350 207, 370 207, 405 207" class="arrow"/>
  <path d="M710 207 C735 207, 760 207, 790 207" class="arrow"/>
  <path d="M557 280 L557 385" class="arrow"/>
  <path d="M620 280 C700 325, 820 330, 905 385" class="arrow"/>
  <path d="M545 535 L545 650" class="arrow"/>
  <path d="M905 535 L905 650" class="arrow-soft"/>
  <path d="M1045 460 C1070 460, 1085 460, 1110 460" class="arrow"/>
  <path d="M790 250 C710 315, 650 335, 595 385" class="arrow-soft"/>

  <rect x="120" y="370" width="210" height="60" class="badge"/>
  <text x="145" y="395" class="box-small">Actions utilisateur</text>
  <text x="145" y="418" class="box-text">Ecrire, envoyer, appeler</text>

  <path d="M225 370 C275 320, 340 285, 405 245" class="arrow-soft"/>

  <rect x="70" y="835" width="1275" height="90" class="box"/>
  <text x="95" y="868" class="box-title">Lecture du schema</text>
  <text x="95" y="897" class="box-text">1) L utilisateur agit dans le frontend. 2) Le navigateur fournit fichiers, camera, micro et notifications. 3) L API REST sauvegarde les donnees.</text>
  <text x="95" y="922" class="box-text">4) Socket.IO diffuse les messages, typing, lectures, notifications et appels. 5) PostgreSQL conserve le coeur metier. 6) Le stockage media durable est a connecter pour la production.</text>
</svg>
